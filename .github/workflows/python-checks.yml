name: Python syntax checks

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m py_compile main.py admin_dashboard.py bot_logic.py telegram_products.py
